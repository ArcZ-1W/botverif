<style>
:root{--bg:#fff;--side:#f8faff;--card:#eef2fb;--line:#e2e7f2;--text:#1a1c24;--mute:#6b7186;--acc:#4d6bfe;--accbg:#e8eeff;--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
[data-theme=dark]{--bg:#16171b;--side:#1d1e23;--card:#26272e;--line:#33353e;--text:#eceef5;--mute:#9aa0b3;--acc:#7b92ff;--accbg:#273157}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:16px/1.6 var(--font);background:var(--bg);color:var(--text);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:23px;letter-spacing:-.03em;color:var(--acc);text-decoration:none;margin-right:auto}
.mk{width:30px;height:30px;border-radius:8px;object-fit:contain}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:500;font-size:15px}
nav a:hover{background:var(--card);color:var(--text)}nav a.on{background:var(--accbg);color:var(--acc)}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:15px}
[data-theme=dark] .btn{color:#101326}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--card);color:var(--text)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:64px 0 56px}
h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.035em;font-weight:800}
h2{font-size:clamp(24px,4vw,32px);letter-spacing:-.02em;line-height:1.2;font-weight:700}
h3{font-size:18px;font-weight:650}
.lead{color:var(--mute);font-size:18px;margin:18px 0 26px;max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute)}
section{padding:44px 0;border-top:1px solid var(--line)}
section>.w>h2{margin-bottom:8px}.sub{color:var(--mute);margin-bottom:24px;max-width:60ch}
/* xoz meter */
.calc{background:var(--side);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 22px rgba(60,80,140,.12)}
[data-theme=dark] .calc{box-shadow:0 4px 22px rgba(0,0,0,.4)}
.meter{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.meter b{font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .35s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.chip small{color:var(--mute);margin-left:4px}.chip.on small{color:inherit}
.calc textarea{width:100%;resize:none;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.calc .row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:12px 0 8px;font-size:14px}
.chk{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.badge.free{background:var(--card);color:var(--mute)}
/* lists */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px}
.feat div{border-left:2px solid var(--acc);padding-left:16px}.feat p{color:var(--mute);margin-top:4px;font-size:15px}
.rows{border-top:1px solid var(--line)}
.rows>*{display:flex;gap:14px 20px;align-items:center;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
.rows .g{flex:1;min-width:200px}.rows .g p{color:var(--mute);font-size:15px}
a.post:hover h3{color:var(--acc)}
.x{font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:56px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:8px}
.plan{border:1px solid var(--line);border-radius:18px;padding:24px}
.plan.pro{border-color:var(--acc);background:var(--accbg)}
.plan .big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:8px 0 12px}
.plan ul{padding-left:18px;color:var(--mute);margin-bottom:18px}.plan.pro ul{color:var(--text)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:14px}
td{font-variant-numeric:tabular-nums}
.art{max-width:64ch;padding:44px 0 20px}.art h1{font-size:clamp(28px,5vw,40px);margin-bottom:10px}
.art p,.art li{margin:14px 0}.art ol,.art ul{padding-left:22px}
.art code{background:var(--card);padding:2px 7px;border-radius:6px;font-size:.92em}
.back{display:inline-block;margin-top:34px;color:var(--acc);text-decoration:none;font-weight:500}
footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--mute);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:780px){.hero{grid-template-columns:1fr;padding:40px 0 36px;gap:30px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<script>
document.getElementById("lg").src=document.querySelector("link[rel=icon]").href;
/* ===== KONFIGURASI ===== */
const APP_URL="ai.html";
const ADMIN_URL="#";            // isi link WhatsApp/Telegram admin, mis. https://wa.me/62xxxx
// Nilai di bawah hanya cadangan. Saat halaman dibuka, MODELS dan XOZ dibaca dari CONFIG di ai.html (nama asli model tidak ikut dibaca).
let XOZ={INITIAL:5000,DAILY:1500,PREMIUM:10000,TIERS:[{max:10,base:100,lo:30,hi:70},{max:20,base:200,lo:20,hi:60},{max:50,base:400,lo:30,hi:70},{max:1e9,base:700,lo:40,hi:100}]};
let MODELS=[
 {name:"Xozen Flash",times:1,premium:false},
 {name:"Xozen Magnesium 2.1",times:2,premium:false},
 {name:"Xozen Titanium",times:3,premium:true}];
const DESC={"Xozen Flash":"Cepat dan hemat. Cocok untuk tanya jawab harian.","Xozen Magnesium 2.1":"Lebih teliti untuk tulisan, ringkasan, dan kode ringan.","Xozen Titanium":"Model premium untuk tugas panjang dan rumit."};
async function loadCfg(){
 try{
  const t=await(await fetch(APP_URL,{cache:"no-cache"})).text();
  const grab=(k,o,c)=>{const i=t.indexOf(k+":");if(i<0)return null;const a=t.indexOf(o,i);let d=0,e=a;for(;e<t.length;e++){if(t[e]===o)d++;else if(t[e]===c&&--d===0)break}return new Function("return "+t.slice(a,e+1))()};
  const m=grab("MODELS","[","]"),x=grab("XOZ","{","}");
  if(m&&m.length)MODELS=m.map(({name,times,premium})=>({name,times:times||1,premium:!!premium}));
  if(x&&x.TIERS)XOZ=Object.assign({},XOZ,x);
 }catch(e){}
}
/* ================================================ */

const $=(s,r=document)=>r.querySelector(s),fmt=n=>Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tier=n=>XOZ.TIERS.find(t=>n<t.max);
const range=(n,t)=>{const r=tier(n);return[(r.base+r.lo)*t,(r.base+r.hi)*t]};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const badge=m=>m.premium?'<span class="badge">Premium</span>':'<span class="badge free">Gratis</span>';

function label(i){const t=TIERS[i],p=TIERS[i-1];return t.max>=1e9?"Mulai "+p.max+" huruf":(i?p.max+" sampai "+(t.max-1):"Di bawah "+t.max)+" huruf"}

function calc(el){
 let bal=XOZ.INITIAL+XOZ.DAILY,mi=0;const max=bal;
 el.innerHTML=`<div class="meter"><b></b><span class="mute">xoz</span><div class="bar"><i></i></div></div><div class="chips"></div>
 <textarea rows="3" aria-label="Pesan contoh" placeholder="Ketik pesan contoh di sini"></textarea>
 <div class="row"><span class="mute info"></span><button class="btn">Kirim</button></div>
 <label class="chk"><input type="checkbox"> Simulasikan akun premium</label>`;
 const q=s=>$(s,el),tx=q("textarea"),pm=q("input"),go=q(".btn");
 function draw(){
  q(".meter b").textContent=fmt(bal);q(".bar i").style.width=bal/max*100+"%";
  q(".chips").innerHTML=MODELS.map((m,i)=>`<button class="chip ${i===mi?"on":""}" data-i="${i}">${esc(m.name)}<small>${m.times}×${m.premium?" Premium":""}</small></button>`).join("");
  const n=[...tx.value].length,m=MODELS[mi],lock=m.premium&&!pm.checked;let msg="",ok=n>0;
  if(lock){msg="Model ini butuh akun premium (diaktifkan admin).";ok=false}
  else if(n){const[a,b]=range(n,m.times);msg=n+" huruf, sekitar "+fmt(a)+" sampai "+fmt(b)+" xoz";if(bal<a){msg="Saldo tidak cukup untuk pesan ini.";ok=false}}
  else msg="Ketik pesan untuk melihat biayanya.";
  q(".info").textContent=msg;go.disabled=!ok;
 }
 el.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){mi=+c.dataset.i;draw()}});
 tx.oninput=pm.onchange=draw;
 go.onclick=()=>{const n=[...tx.value].length,r=tier(n),c=Math.min(bal,(r.base+rnd(r.lo,r.hi))*MODELS[mi].times);bal-=c;tx.value="";draw();q(".info").textContent="Terpakai "+fmt(c)+" xoz."};
 draw();
}

function route(){
 let h=location.hash.slice(1);
 if(!h){const p=location.pathname.split("/").filter(Boolean).pop()||"";if(PAGES[p])h=p}
 const post=h.startsWith("blog-")&&POSTS.find(p=>"blog-"+p.id===h);
 const pg=post?"blog":PAGES[h]?h:"home";
 $("#nav").innerHTML=[["blog","Blog"],["pricing","Harga"],["models","Model"]].map(([k,t])=>`<a href="#${k}" class="${k===pg?"on":""}">${t}</a>`).join("");
 $("#app").innerHTML=post?`<article class="art"><h1>${esc(post.t)}</h1><p class="mute">${esc(post.s)}</p>${post.b}<a class="back" href="#blog">Kembali ke blog</a></article>`:PAGES[pg]();
 const d=$("#demo");if(d)calc(d);
 document.title=(pg==="home"?"":(post?post.t:{blog:"Blog",pricing:"Harga",models:"Model"}[pg])+" - ")+"Xozen";
 scrollTo(0,0);
}
addEventListener("hashchange",route);loadCfg().then(()=>{POSTS=mkPosts();route()});
